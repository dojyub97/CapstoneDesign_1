{% load static %}

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />>
  </head>
  <body class="antialiased text-gray-800">
    <!-- Layout for Chatbot -->
    <div class="flex h-screen">
      <!-- Sidebar and Main Chat Section as provided in the layout -->
      <div class="flex flex-row h-full w-full overflow-x-hidden">
        <!-- Sidebar -->
        <div class="flex flex-col py-8 pl-6 pr-2 w-64 bg-white flex-shrink-0">
          <div class="flex flex-row items-center justify-center h-12 w-full">
            <div class="flex items-center justify-center rounded-2xl text-indigo-700 bg-indigo-100 h-10 w-10">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
              </svg>
            </div>
            <div class="ml-2 font-bold text-2xl">QuickChat</div>
          </div>
          <div id="sidebar" class="mt-4 flex flex-col">
            <div id="menu-buttons" class="flex flex-col space-y-2">
              <button id="home-button" class="flex-1 py-2 px-4 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600"><i class="fas fa-home mr-2"></i>홈</button>
              <button id="school-button" class="flex-1 py-2 px-4 bg-green-500 text-white rounded-lg hover:bg-green-600"><i class="fas fa-school mr-2"></i>학교정보</button>
              <button id="problem-button" class="flex-1 py-2 px-4 bg-red-500 text-white rounded-lg hover:bg-red-600"><i class="fas fa-question-circle mr-2"></i>문제생성</button>
            </div>
          </div>
        </div>

        <!-- Chat section -->
        <div class="flex flex-col flex-auto h-full p-6">
          <div class="flex flex-col flex-auto flex-shrink-0 rounded-2xl bg-gray-100 h-full p-4">
            <div id="message-container" class="flex flex-col h-full overflow-x-auto mb-4">
              <!-- Messages will appear here dynamically -->
            </div>

            <!-- Message input section -->
            <div class="flex flex-row items-center h-16 rounded-xl bg-white w-full px-4">
              <div class="flex-grow ml-4">
                <input id="chat-input" type="text" placeholder="Type a message..." class="flex w-full border rounded-xl focus:outline-none focus:border-indigo-300 pl-4 h-10" />
              </div>
              <div class="ml-4">
                <button id="send-button" class="flex items-center justify-center bg-indigo-500 hover:bg-indigo-600 rounded-xl text-white px-4 py-1">
                  <span>Send</span>
                  <span class="ml-2">
                    <svg class="w-4 h-4 transform rotate-45 -mt-px" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="{% static 'chat_app/js/chatbotEvent.js' %}"></script> <!-- JavaScript 연결 -->
  </body>
</html>
