{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{% static 'chat_app/css/signup.css' %}">
</head>
<body>
    <div class="signup-container">
        <h1>Create account!</h1>
        <p id="error-message" class="error-message" style="display: none;"></p>
        <form id="signup-form">
            <div class="input-container">
                <input type="text" id="username" placeholder="Name" required>
            </div>
            <div class="input-container">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-container">
                <input type="password" id="password2" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="create-button">Create ➔</button>
        </form>
        <p class="login-link">Already have an account? <a href="{% url 'chat_app:login' %}">Login</a></p>
    </div>

    <script src="{% static 'chat_app/js/signUpEvent.js' %}"></script>
</body>
</html>
